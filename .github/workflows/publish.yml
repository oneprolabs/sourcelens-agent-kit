name: Publish to npm

# Publishes to the official npm registry (registry.npmjs.org) when a version
# tag (v*) is pushed. Mirrors such as npmmirror sync from npm automatically,
# so never publish to a mirror.
#
# Required repository secret (Settings -> Secrets and variables -> Actions):
#   NPM_TOKEN - npm automation token with publish rights for sourcelens-agent-kit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm test

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
